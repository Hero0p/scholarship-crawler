    name: National Scholarship Portal
    provider: National Scholarship Portal, Government of India
    source_type: GOV_CENTRAL
    trust_tier: 1
    seeds: [https://scholarships.gov.in/]
    page_budget: 200
    base_frequency_hours: 24
