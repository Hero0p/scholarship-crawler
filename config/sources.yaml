# Seed registry: official entry points (hubs) for the focused crawler.
# Scheme-specific pages are discovered by the crawler, not hard-coded here.
# Fields: key, name, provider, source_type, trust_tier, seeds, render_js, max_depth,
#         page_budget, base_frequency_hours, role (CRAWL | DISCOVERY_ONLY), domain_aliases
# Seed URLs checked on 2026-11-13 (see PROJECT_PLAN.md §18).

defaults:
  render_js: false
  max_depth: 3
  page_budget: 120
  base_frequency_hours: 72
  role: CRAWL
  approval_status: APPROVED

sources:
  # ---------------- Central government, regulators, PSUs ----------------
