# URL fragments never worth fetching
deny_url_patterns:
  - "\\.(jpg|jpeg|png|gif|svg|webp|ico|css|js|mp4|mp3|avi|mov|zip|rar|7z|xls|xlsx|ppt|pptx|exe|apk|woff2?|ttf)(\\?|$)"
  - "(facebook|twitter|x|instagram|linkedin|youtube|whatsapp|telegram|t)\\.(com|me)/"
  - "mailto:"
  - "tel:"
  - "javascript:"
  - "/(login|signin|sign-in|register\\.aspx|logout)"
  - "[?&](lang|language)=(hi|hin|hindi)"
  - "/hi/"
  - "/hindi/"
  - "[?&](print|share|sort|order|replytocom)="
  - "/(wp-json|feed|xmlrpc)"
  - "/tag/"
  - "/author/"

