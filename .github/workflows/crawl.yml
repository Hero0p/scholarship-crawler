name: daily-crawl
on:
  schedule:
    - cron: "30 20 * * *"     # 02:00 IST, off-peak for government servers
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m atlas.cli run --trigger SCHEDULED
      - name: Export sample data
        run: python -m atlas.cli export
      - name: Commit updated database and evidence
        run: |
          git config user.name "atlas-crawler-bot"
          git config user.email "atlas-crawler-bot@users.noreply.github.com"
          git add data/atlas.db data/sample
          python -m atlas.cli evidence-files | xargs -r git add -f
          git commit -m "Scheduled crawl $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
