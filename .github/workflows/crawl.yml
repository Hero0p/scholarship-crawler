name: daily-crawl

on:
  schedule:
    - cron: "30 20 * * *"     # 20:30 UTC = 02:00 IST (off-peak for government servers)
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab (use it to test)

permissions:
  contents: write              # the job commits the updated database back to the repo

concurrency:                   # never two crawls at once
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (recheck -> leads -> crawl -> process -> verify -> lifecycle)
        run: python -m atlas.cli run --trigger SCHEDULED 2>&1 | tee run.log

      - name: Export sample data + checkpoint database
        run: |
          python -m atlas.cli export
          python -m atlas.cli checkpoint
          python -m atlas.cli report | tail -40

      - name: Commit updated database and evidence snapshots
        run: |
          git config user.name "atlas-crawler-bot"
          git config user.email "atlas-crawler-bot@users.noreply.github.com"
          git add data/atlas.db data/sample
          # raw + text snapshots of every page that current evidence points to (keeps traceability verifiable)
          python -m atlas.cli evidence-files | xargs -r git add -f
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Scheduled crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log-${{ github.run_number }}
          path: |
            run.log
            data/logs/
          retention-days: 14
